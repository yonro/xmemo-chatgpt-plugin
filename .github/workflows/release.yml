name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Build deterministic plugin package
        run: python scripts/package_plugin.py "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/xmemo-plugin-${{ github.ref_name }}.zip
