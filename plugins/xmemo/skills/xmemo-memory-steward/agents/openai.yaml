interface:
  display_name: "XMemo Memory Steward"
  short_description: "Recall, save, and manage memory across conversations"
  default_prompt: "Use $xmemo-memory-steward to recall relevant saved context and save the new information I ask to carry forward."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "xmemo"
      description: "XMemo authenticated memory tools"
      transport: "streamable_http"
      url: "https://xmemo.dev/mcp"
